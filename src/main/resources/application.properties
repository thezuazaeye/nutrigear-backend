# ===== NutriGear backend: configuración =====
# Este archivo SE SUBE a GitHub. Por eso NUNCA debe tener claves reales:
# los secretos se leen desde variables de entorno con la sintaxis ${NOMBRE:valor_por_defecto}.

# Nombre de la aplicación y puerto donde escucha (http://localhost:8080)
spring.application.name=nutrigear-backend
server.port=8080

# --- Base de datos ---
# Por ahora H2 en memoria: es una base temporal que vive mientras la app está encendida.
# Más adelante se cambia a Supabase (PostgreSQL) solo modificando estas líneas con variables de entorno.
spring.datasource.url=jdbc:h2:mem:nutrigear;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: "update" crea o ajusta las tablas automáticamente según las clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Evita mantener la conexión abierta durante toda la petición HTTP (buena práctica)
spring.jpa.open-in-view=false

# --- JWT ---
# Clave para firmar los tokens (Base64, 256 bits). Se lee de la variable de entorno JWT_SECRET.
# El valor después de los dos puntos es SOLO para desarrollo local: en producción se define JWT_SECRET real.
app.jwt.secret=${JWT_SECRET:MtCffAaUPPeeN7kLGIaNyPg/VNP8wJ3MSZNkyF1Af/Y=}
# Duración del token en milisegundos (2 horas = 7.200.000)
app.jwt.expiration-ms=7200000

# --- CORS ---
# Orígenes (páginas web) autorizados para llamar a esta API desde el navegador
app.cors.allowed-origins=http://localhost:5173,https://nutrigear-tau.vercel.app
